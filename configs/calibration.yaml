pattern_cols: 11    # 标定板内部角点的列数，也就是格子列数减一
pattern_rows: 8     # 标定板内部角点的行数，也就是格子行数减一
square_size_mm: 30  # 标定板方格边长
preview_scale: 0.5  # 图像缩放比例（范围在 (0,1] ），缩小图像以加快处理速度
detect_interval: 2  # 画面检测间隔（单位：帧）

R_gimbal2imubody: [1, 0, 0, 
                   0, 1, 0, 
                   0, 0, 1]

#####-----camera参数-----#####
camera_name: "hikrobot"
exposure_ms: 2
gain: 16.0
vid_pid: "2bdf:0001"

#####-----ovgimbal参数-----#####
timing:
  offset: 0.002

#####-----标定结果参数-----#####
# 重投影误差: 0.0913px
camera_matrix: [1823.9963993419956, 0, 711.09463943585467, 0, 1826.2857680471473, 542.72405068229602, 0, 0, 1] # 相机内参矩阵
distort_coeffs: [-0.084184390952579208, 0.22930994117456757, 1.0388259828447162e-05, 0.00079329515085383871, 0] # 相机畸变系数
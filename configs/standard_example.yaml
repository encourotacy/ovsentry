# enemy_color: "red"
enemy_color: "blue"

#####-----OVGimbal参数-----#####
default_bullet_speed: 23.0 # 默认弹速，弹速闭环时即为这个弹速
timing:
  offset: -0.0009 # s, 串口姿态固定时间补偿，最大精度为小数点后六位。



#####-----装甲板识别神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5_0526.xml
device: CPU
use_traditional: false

use_roi: false # 是否启用 roi，不启用则识别整张图片
roi:
  x: 500 # (x,y) 是矩阵的左上角坐标
  y: 400
  width: 500   # 使用-1则表示不在这个方向裁切
  height: 500  # 使用-1则表示不在这个方向裁切



#####-----相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 1.8  # 曝光时间，s
gain: 14          # 增益，范围 [0,17) ?
vid_pid: "2bdf:0001"

R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]

# 重投影误差: 0.0913px
camera_matrix: [1823.9963993419956, 0, 711.09463943585467, 0, 1826.2857680471473, 542.72405068229602, 0, 0, 1]
distort_coeffs: [-0.084184390952579208, 0.22930994117456757, 1.0388259828447162e-05, 0.00079329515085383871, 0]

#python3 euler_to_matrix.py --yaw 0.45 --pitch 1.3 --roll 0 --ascento
# 相机同理想情况的偏角: yaw-1.48 pitch-1.09 roll2.43 degree
R_camera2gimbal: [-0.0078539008887113342, 0.022686633841980532, 0.9997117749060227,
 -0.99996915764478966, -0.00017818406930975798, -0.0078518793678421291,
 -0, -0.99974260932269832, 0.022687333572781358]

# t_camera2gimbal: [0.06521841254429836, -0.0023919863423267963, 0.086964699970889861]
t_camera2gimbal: [0.0915, -0.0011477414625710339, 0.085] # 前后/左右/上下
# 这个数据建议直接找机械给然后自己调试，标定程序准确度很差



#####-----MPC相关参数-----#####
max_yaw_acc: 30
Q_yaw: [5e6,0] #[5e6,0]
R_yaw: [1]

max_pitch_acc: 50
Q_pitch: [9e6, 0] #[9e6, 9e3]
R_pitch: [1]



#####-----火控参数-----#####
yaw_offset: 0.47 # degree
pitch_offset: -0.95 # degree
resistance_k: 0.000
traj_g: 9.6333 # 重力加速度

high_speed_delay_time: 0.010 # s
low_speed_delay_time: 0.009 # s
decision_speed: 7 # rad/s

fire_thresh: 0.60

is_multiple_thresh: true
planner_judge_distance: [0.90, 1.50, 1.90, 2.30, 2.80, 3.50, 4.20, 5.00, 100] # m
planner_fire_thresh: [9.00, 4.20, 3.00, 1.90, 0.72, 0.45, 0.27, 0.13, 0.10] # degree
  # 若距离大于judge_distance_for_planner的最后一位，则使用最后一位的阈值

high_spin_force_enabled_planner: true
high_spin_force_enter_speed_planner: 13 # rad/s
high_spin_force_exit_speed_planner: 11 # rad/s
plus_k: 2 # 乘的系数
  # 高转速时，将阈值乘以一个系数，以防打不出子弹